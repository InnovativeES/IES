<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Debug</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-red-500 flex h-screen items-center justify-center">
    <div class="bg-white p-10 rounded-xl shadow-2xl text-center">
        <h1 class="text-4xl font-bold text-red-600 mb-4">Tailwind Diagnostic</h1>
        <p class="text-xl text-gray-700">If this box is white and the background is RED, Tailwind is working.</p>
        <p class="mt-4 text-sm text-gray-500">If the background is white/plain, Tailwind is BLOCKED.</p>
    </div>
</body>

</html>
